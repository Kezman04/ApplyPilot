[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applypilot_backend"
version = "0.1.0"
description = "ApplyPilot backend foundation"
readme = "README.md"
license = {text="MIT"}
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-docx",
]

[tool.black]
line-length = 88
preview = true

[tool.isort]
profile = "black"
